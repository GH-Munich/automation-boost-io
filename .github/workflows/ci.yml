name: CI

# Golden-Test-Suite ist Release-Voraussetzung (G1): kein Merge mit rotem Test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  detektor-engine:
    name: detektor engine (typecheck + golden tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/detektor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/detektor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Golden-Test-Suite (vitest)
        run: npm test
