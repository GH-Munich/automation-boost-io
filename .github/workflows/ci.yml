name: CI

# Golden-Test-Suite ist Release-Voraussetzung (G1): kein Merge mit rotem Test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  detektor-engine:
    name: detektor engine (typecheck + golden tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/detektor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/detektor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Golden-Test-Suite (vitest)
        run: npm test

      - name: Production build (next build)
        run: npm run build

      # Informativ, kein Merge-Blocker: die aktuell gemeldeten High-Advisories
      # betreffen ausschließlich von Next gebündelte Transitiv-Deps (postcss,
      # sharp) und lassen sich nur mit einem Next-Sprung beheben. Sichtbar
      # halten, aber CI nicht daran rot färben (Next-Bump ist eigene Aufgabe).
      - name: Dependency audit (production, high+, informativ)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
